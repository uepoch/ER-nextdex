name: Build upcoming dex and deploy to Pages

on:
  schedule:
    # Daily at 04:17 UTC. Scheduled workflows run from the default branch.
    - cron: '17 4 * * *'
  push:
    branches: [github-pages]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout latest public config (not the pinned submodule)
        uses: actions/checkout@v4
        with:
          repository: Elite-Redux/er-config
          ref: upcoming
          path: er-config
          persist-credentials: false
      - name: Checkout public game source for encounters and scripts
        uses: actions/checkout@v4
        with:
          repository: Elite-Redux/eliteredux-source
          ref: upcoming
          path: game-source
          persist-credentials: false
          sparse-checkout: |
            include
            src
            data/maps
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run protoc
      - run: npm run build
      - name: Generate and validate upcoming data
        run: node postBuild/build_upcoming.mjs game-source
      - name: Record source revisions
        run: |
          echo '### Upcoming dex sources' >> "$GITHUB_STEP_SUMMARY"
          cat static/build-info.json >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './static/'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
